# Map labels for the oblique renders (chinamaps.annotate) and the web map.
#
# kind: peak, range, plateau, basin, plain, desert, river, lake, sea, island, city, region
# rank: 1 = most important (always tried first), 2 = national map, 3 = regional scenes only.
# lon/lat: WGS84 anchor (a representative point, not the centroid of an odd shape). Taken from
#   Natural Earth 5.1.2 (geography_regions_polys label points, elevation_points, populated_places)
#   where they fit, else from general knowledge; `approx: true` marks the less certain ones.
# points: extra candidate anchors [[lon, lat], ...]; the first one inside a scene is used, so long
#   ranges get a label in the regional close-ups too. The web map labels river points as well.
# ne_river: Natural Earth river names; the anchor snaps to the nearest point of that river inside
#   the scene, so river labels sit on the water.
# elevation: metres (peaks).
# web_minzoom: first zoom on the web map (default by rank; the national web view is about z3.3, and the
#   南海诸岛 inset there carries the South China Sea names).

# Per-scene label settings (defaults: max_rank 3, scale 1.0, peak_elevations true). `small` overrides
# them for the 1280 px README copy (gallery/<name>_small.jpg), which is re-annotated, not downsampled.
scenes:
  china: {max_rank: 2, scale: 0.47, peak_elevations: false, small: {max_rank: 1, scale: 0.8}}
  himalaya-everest: {scale: 1.1}
  hengduan-three-rivers: {scale: 1.1}
  sichuan-basin-tibet-edge: {scale: 1.05}
  guilin-karst: {scale: 1.15}

# Chinese names for city-model landmarks (English names come from config/cities.yaml).
